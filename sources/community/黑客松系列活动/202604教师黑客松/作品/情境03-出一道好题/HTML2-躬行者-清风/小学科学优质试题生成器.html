<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小学科学优质试题生成器 | TeacherYO首届教师黑客松大赛</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
        :root {
            --primary-color: #3498db; --secondary-color: #2ecc71; --accent-color: #e74c3c;
            --light-bg: #f0f7ff; --dark-text: #2c3e50; --light-text: #7f8c8d;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08); --border-radius: 12px;
        }
        
        body { background-color: var(--light-bg); color: var(--dark-text); line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        header {
            text-align: center; margin-bottom: 30px; padding: 35px 20px;
            background: linear-gradient(135deg, #3498db, #2ecc71);
            border-radius: var(--border-radius); color: white; box-shadow: var(--shadow);
            position: relative;
        }
        
        .logo { font-size: 2.5rem; margin-bottom: 10px; }
        h1 { font-size: 2.2rem; margin-bottom: 5px; }
        .subtitle { font-size: 1.1rem; opacity: 0.9; margin-bottom: 15px; }
        
        /* 比赛信息角标 */
        .comp-info {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: inline-block;
            padding: 5px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .content { display: grid; grid-template-columns: 1fr 2fr; gap: 25px; }
        @media (max-width: 900px) { .content { grid-template-columns: 1fr; } }
        
        .control-panel, .result-panel { background-color: white; border-radius: var(--border-radius); padding: 25px; box-shadow: var(--shadow); }
        .panel-title { font-size: 1.5rem; color: var(--primary-color); margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; }
        select, input { width: 100%; padding: 12px; border: 2px solid #e0e6ed; border-radius: 8px; font-size: 1rem; outline: none; }
        
        .knowledge-tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .tag { background-color: #e8f4fc; color: var(--primary-color); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; border: 1px solid transparent; }
        .tag.active { background-color: var(--primary-color); color: white; }
        
        .switch-group { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--secondary-color); }
        input:checked + .slider:before { transform: translateX(22px); }

        .btn { padding: 12px 25px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-secondary { background-color: var(--secondary-color); color: white; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-group .btn { flex: 1; }

        .result-layout { display: flex; gap: 20px; margin-top: 20px; flex-direction: column; }
        @media (min-width: 768px) { .result-layout.with-img { flex-direction: row; } }
        .result-image-box { flex: 1; }
        .result-image-box img { width: 100%; border-radius: 10px; border: 1px solid #ddd; }
        .result-text-box { flex: 1.5; }

        .loading { display: none; text-align: center; padding: 40px; }
        .loading.active { display: block; }
        .result-content { background: #f9f9f9; padding: 25px; border-radius: 8px; border: 1px solid #eee; margin-top: 20px; min-height: 300px; }
        
        .config-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        #configModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
        .modal-body { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 450px; }

        .result-section { margin-bottom: 25px; }
        .result-section h3 { color: var(--primary-color); border-left: 4px solid var(--secondary-color); padding-left: 10px; margin-bottom: 12px; font-size: 1.1rem; }
        .error-item { background: #fff5f5; border-left: 4px solid var(--accent-color); padding: 10px; margin-bottom: 8px; font-size: 0.9rem; border-radius: 0 4px 4px 0; }
        
        footer { 
            text-align: center; margin-top: 40px; padding: 30px; 
            color: var(--light-text); border-top: 1px solid #e0e6ed;
            line-height: 1.8;
        }
        .footer-tag { color: var(--primary-color); font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <button class="config-btn" id="openConfigBtn"><i class="fas fa-cog"></i> API配置</button>
            <div class="logo"><i class="fas fa-microscope"></i></div>
            <h1>小学科学优质试题生成器</h1>
            <p class="subtitle">让科学探究在真实情境中发生</p>
            <div class="comp-info">
                <i class="fas fa-trophy"></i> TeacherYO社群首届教师黑客松大赛 参赛作品
            </div>
        </header>

        <div class="content">
            <div class="control-panel">
                <h2 class="panel-title"><i class="fas fa-edit"></i> 命题工作台</h2>
                
                <div class="form-group">
                    <label>科学领域</label>
                    <select id="knowledgeArea">
                        <option value="material">物质科学</option>
                        <option value="life">生命科学</option>
                        <option value="earth">地球与宇宙科学</option>
                        <option value="tech">技术与工程</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>适用年段</label>
                    <select id="gradeLevel">
                        <option value="low">低学段（1-2年级）- 极简童趣</option>
                        <option value="middle" selected>中学段（3-4年级）- 逻辑探究</option>
                        <option value="high">高学段（5-6年级）- 综合分析</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>探究知识点</label>
                    <input type="text" id="knowledgePoint" placeholder="点击下方标签或手动输入...">
                    <div class="knowledge-tags" id="tagContainer"></div>
                </div>

                <div class="form-group">
                    <div class="switch-group">
                        <label class="switch">
                            <input type="checkbox" id="enableImg">
                            <span class="slider"></span>
                        </label>
                        <span>开启 AI 科学情境绘图</span>
                    </div>
                </div>

                <div class="btn-group">
                    <button id="generateBtn" class="btn btn-secondary"><i class="fas fa-wand-magic-sparkles"></i> 一键生成优质试题</button>
                </div>
            </div>

            <div class="result-panel">
                <h2 class="panel-title"><i class="fas fa-eye"></i> 试题预览区</h2>
                <div class="loading" id="loadingIndicator">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p style="margin-top:15px; font-weight: 600;">AI 正在构建沉浸式探究情境...</p>
                </div>
                <div id="resultContent" class="result-content">
                    <div style="text-align:center; color:#999; padding-top:80px">
                        <i class="fas fa-file-signature fa-3x" style="opacity: 0.2; margin-bottom: 20px;"></i>
                        <p>请在左侧配置完成后点击生成</p>
                    </div>
                </div>
                <div class="btn-group" style="margin-top:20px">
                    <button id="copyBtn" class="btn btn-primary"><i class="fas fa-copy"></i> 复制试题内容</button>
                </div>
            </div>
        </div>

        <footer>
            <p><span class="footer-tag">项目名称：</span>小学科学优质试题生成器</p>
            <p><span class="footer-tag">所属赛事：</span>TeacherYO社群首届教师黑客松大赛</p>
            <p><span class="footer-tag">作者团队：</span>躬行者 & 清风</p>
            <p><span class="footer-tag">提交时间：</span>2026年4月11日</p>
        </footer>
    </div>

    <!-- API 配置弹窗 -->
    <div id="configModal">
        <div class="modal-body">
            <h3 style="margin-bottom:20px"><i class="fas fa-key"></i> API 配置端口</h3>
            <div class="form-group"><label>API Key</label><input type="password" id="apiKey" placeholder="sk-..."></div>
            <div class="form-group"><label>Base URL</label><input type="text" id="apiBase" placeholder="https://api.deepseek.com/v1"></div>
            <div class="form-group"><label>模型名称</label><input type="text" id="apiModel" placeholder="deepseek-chat"></div>
            <div class="btn-group">
                <button id="saveConfigBtn" class="btn btn-secondary">保存配置</button>
                <button id="closeConfigBtn" class="btn">取消</button>
            </div>
        </div>
    </div>

    <script>
        const KNOWLEDGE_MAP = {
            material: ["水的三态变化", "磁铁的性质", "简单电路", "光的折射"],
            life: ["植物的萌发", "蝴蝶的一生", "校园的蜗牛", "身体的呼吸"],
            earth: ["太阳和影子", "神奇的天气", "地球的形状", "月亮的变化"],
            tech: ["纸飞机的秘密", "坚固的拱桥", "神奇的滑轮", "自动小车"]
        };

        const DEFAULT_API = { url: 'https://api.deepseek.com/v1', model: 'deepseek-chat' };

        document.addEventListener('DOMContentLoaded', function() {
            const areaSelect = document.getElementById('knowledgeArea');
            const tagContainer = document.getElementById('tagContainer');
            const kpInput = document.getElementById('knowledgePoint');

            // 联动标签
            function updateTags() {
                tagContainer.innerHTML = '';
                (KNOWLEDGE_MAP[areaSelect.value] || []).forEach(text => {
                    const t = document.createElement('div'); t.className = 'tag'; t.textContent = text;
                    t.onclick = () => { kpInput.value = text; document.querySelectorAll('.tag').forEach(el => el.classList.remove('active')); t.classList.add('active'); };
                    tagContainer.appendChild(t);
                });
            }
            areaSelect.onchange = updateTags;
            updateTags();

            // 配置弹窗
            document.getElementById('openConfigBtn').onclick = () => {
                document.getElementById('configModal').style.display = 'flex';
                document.getElementById('apiKey').value = localStorage.getItem('sci_key') || '';
                document.getElementById('apiBase').value = localStorage.getItem('sci_base') || DEFAULT_API.url;
                document.getElementById('apiModel').value = localStorage.getItem('sci_model') || DEFAULT_API.model;
            };
            document.getElementById('closeConfigBtn').onclick = () => document.getElementById('configModal').style.display = 'none';
            document.getElementById('saveConfigBtn').onclick = () => {
                localStorage.setItem('sci_key', document.getElementById('apiKey').value);
                localStorage.setItem('sci_base', document.getElementById('apiBase').value);
                localStorage.setItem('sci_model', document.getElementById('apiModel').value);
                document.getElementById('configModal').style.display = 'none';
            };

            // 生成试题
            document.getElementById('generateBtn').onclick = async () => {
                const key = localStorage.getItem('sci_key');
                const kp = kpInput.value;
                const useImg = document.getElementById('enableImg').checked;
                if(!key || !kp) return alert('请先配置API并选择知识点');

                const loading = document.getElementById('loadingIndicator');
                const result = document.getElementById('resultContent');
                loading.classList.add('active');
                result.innerHTML = '';

                const gradeText = document.getElementById('gradeLevel').selectedOptions[0].text;
                
                let prompt = `你是一个小学科学教育专家。请针对"${kp}"，为${gradeText}学生设计一道探究题。
                要求：
                1. 沉浸式情境：必须让学生作为主角（使用“你...”开头）。
                2. 学段适配：
                   - 如果是低学段（1-2年级），题目文字必须极简（100-150字内），使用非常有童趣、直观、口语化的语言，避免科学术语。
                   - 中高学段侧重逻辑推理。
                3. 考查素养：侧重观察和预测。`;
                
                if(useImg) prompt += `\n4. 请生成一个50字内的英文绘图提示词(imagePrompt)，描述本题的情境。`;
                prompt += `\n请严格以JSON格式输出：{"title":"","question":"","answer":"","rubric":[],"errors":[], "imagePrompt": ""}`;

                try {
                    const resp = await fetch(`${localStorage.getItem('sci_base')}/chat/completions`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: localStorage.getItem('sci_model'),
                            messages: [{role: "system", content: "你只输出JSON。"}, {role: "user", content: prompt}],
                            temperature: 0.8
                        })
                    });
                    const data = await resp.json();
                    const content = JSON.parse(data.choices[0].message.content.replace(/```json|```/g, ''));
                    
                    let html = `<div class="result-layout ${useImg ? 'with-img' : ''}">`;
                    if(useImg && content.imagePrompt) {
                        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(content.imagePrompt + ", educational cartoon style, bright")}?width=500&height=500&nologo=true`;
                        html += `<div class="result-image-box"><img src="${imageUrl}"></div>`;
                    }
                    html += `
                        <div class="result-text-box">
                            <div class="result-section"><h3>${content.title}</h3><div style="white-space:pre-line">${content.question}</div></div>
                            <div class="result-section"><h3>参考答案</h3><p style="background:#e8f8f5; padding:10px; border-radius:6px;">${content.answer}</p></div>
                        </div>
                    </div>
                    <div class="result-section"><h3>评分建议</h3><ul>${content.rubric.map(r => `<li>${r}</li>`).join('')}</ul></div>
                    <div class="result-section"><h3>典型错因分析</h3>${content.errors.map(e => `<div class="error-item">${e}</div>`).join('')}</div>
                    `;
                    result.innerHTML = html;
                } catch (e) {
                    result.innerHTML = `<p style="color:red">生成失败：${e.message}</p>`;
                } finally {
                    loading.classList.remove('active');
                }
            };

            document.getElementById('copyBtn').onclick = () => {
                navigator.clipboard.writeText(document.getElementById('resultContent').innerText);
                alert('已成功复制文字内容');
            };
        });
    </script>
</body>
</html>
